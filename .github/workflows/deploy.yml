name: Deploy to GitHub Pages

# main 브랜치에 push 되면 자동으로 빌드 → 배포
#
# 서버가 필요한 기능(회원·기록 등)은 브라우저 안에서 같은 규칙으로 동작하므로
# 정적 호스팅에서도 그대로 쓸 수 있습니다.
on:
  push:
    branches: [main]
  workflow_dispatch: # 저장소 Actions 탭에서 수동 실행도 가능

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 최신 것만 진행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      - name: SPA 폴백 생성
        # GitHub Pages는 정적 호스팅이라 /about 같은 경로를 모른다.
        # index.html을 404.html로 복사해두면 앱이 부팅되고 라우터가 경로를 처리한다.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
